# R0-18 §2.2 (scope R1-01: Composer and GitHub Actions; npm and docker follow with their first use).
# Daily at a fixed time, one group per ecosystem, security updates in their own group,
# at most 2 open PRs per ecosystem (Actions queue limits, owner instruction 23.11.2026).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: '05:00'
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ['*']
      composer:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '05:00'
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions:
        applies-to: version-updates
        patterns: ['*']
