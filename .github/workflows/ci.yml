# CI for Course Captain Free (R0-18 §1; scope of R1-01: J-01, J-03, J-05, J-07, J-10, J-11, J-12).
# Further jobs (J-02, J-04, J-06, J-08, J-09, J-13 ... J-23) are added by the tasks that need them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly (R0-18 §1.2)
  workflow_dispatch:
  workflow_call:
    inputs:
      lane:
        description: 'pr | main | nightly | release'
        type: string
        default: release

# G-01: read-only by default.
permissions:
  contents: read

# G-05: cancel superseded PR runs only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# G-04: bash with pipefail.
defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint-php:
    name: J-01 lint-php (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # MINVER-1 (17.11.2026): PHP 8.5 required, 8.6 experimental.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        experimental: [false]
        include:
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: composer validate --strict
      - run: composer install --no-progress
      - name: php -l (shipped files)
        run: |
          find course-captain.php uninstall.php src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPCS (full WPCS, PHPCompatibilityWP 8.5-)
        run: vendor/bin/phpcs
      - name: Bootstrap file parses on old PHP (RC-047)
        run: vendor/bin/phpcs --standard=tools/qa/phpcs-bootstrap-compat.xml

  lint-i18n:
    name: J-03 lint-i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: Text domain lint (literal course-captain, English source strings)
        run: php tests/guards/textdomain-lint.php
      - name: POT is up to date
        run: |
          vendor/bin/wp i18n make-pot . "$RUNNER_TEMP/course-captain.pot" --slug=course-captain --domain=course-captain \
            --exclude=vendor,tests,tools,docs,node_modules \
            --headers='{"Report-Msgid-Bugs-To":"https://wordpress.org/support/plugin/course-captain/"}'
          diff <(grep -v '^"POT-Creation-Date' languages/course-captain.pot) <(grep -v '^"POT-Creation-Date' "$RUNNER_TEMP/course-captain.pot")

  phpstan:
    name: J-05 phpstan (level 8, no baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - run: composer install --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  deps:
    name: J-07 deps
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - run: composer audit --locked
      - name: G-02 service images pinned by digest (O-4; warning until the first pin run)
        run: tools/ci/image-digests.sh check || true
      - name: G-02 digest drift (nightly; Dependabot does not cover service images)
        if: ${{ github.event_name == 'schedule' }}
        env:
          CCAP_DRY_RUN: '1'
        run: tools/ci/image-digests.sh refresh

  free-guard:
    name: J-10 free-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - name: Guard self-test (LIC-010)
        run: php tests/guards/free-guard.php --self-test
      - name: Guard on the source tree (LIC-001, RC-020)
        run: php tests/guards/free-guard.php

  unit:
    name: J-11 unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # MINVER-1 (17.11.2026): PHP 8.5 required, 8.6 experimental.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        experimental: [false]
        include:
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: composer install --no-progress
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist --log-junit "$RUNNER_TEMP/junit-unit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-unit-php${{ matrix.php }}
          path: ${{ runner.temp }}/junit-unit.xml
          retention-days: 14

  integration:
    name: J-12 integration ${{ matrix.row }} (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, ${{ matrix.db_image }})
    # Rows on every run (R0-18 §1.3, MINVER-1): M-Z (PHP 8.5/WP 7.1/MariaDB 12.3), M-U (PHP 8.5/WP 7.0/MariaDB 12.3), M-M9 (MySQL 9.7), M-M (MySQL 8.4, best effort); M-MS runs as its own job (integration-multisite).
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: M-Z
            php: '8.5'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mariadb:12.3'
            db_health: 'healthcheck.sh --connect --innodb_initialized'
          - row: M-U
            # Lower bound after MINVER-1 (17.11.2026): PHP 8.5, WordPress 7.0, MariaDB 12.3.
            php: '8.5'
            wp: '7.0.8'
            wp_phpunit: '7.0.7'
            db_image: 'mariadb:12.3'
            db_health: 'healthcheck.sh --connect --innodb_initialized'
          - row: M-M
            # MySQL 8.4 below "supported from" (best effort with a status warning, MINVER-1).
            php: '8.5'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mysql:8.4'
            db_health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'
          - row: M-M9
            # Target MySQL (MINVER-1, 17.11.2026: PHP 8.5+, MySQL 9.7+, MariaDB 12.3+).
            php: '8.5'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mysql:9.7'
            db_health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'
    services:
      database:
        image: ${{ matrix.db_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ccap_test
          MYSQL_USER: ccap
          MYSQL_PASSWORD: ccap
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ccap_test
          MARIADB_USER: ccap
          MARIADB_PASSWORD: ccap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db_health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DB_NAME: ccap_test
      WP_TESTS_DB_USER: ccap
      WP_TESTS_DB_PASSWORD: ccap
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: Select WordPress ${{ matrix.wp }}
        if: ${{ matrix.wp != '7.1.4' }}
        env:
          WP_VERSION: ${{ matrix.wp }}
          WP_PHPUNIT_VERSION: ${{ matrix.wp_phpunit }}
        run: composer require --dev --no-progress -W "roots/wordpress-no-content:${WP_VERSION}" "wp-phpunit/wp-phpunit:${WP_PHPUNIT_VERSION}"
      - name: PHPUnit with the WordPress test suite
        run: vendor/bin/phpunit --configuration phpunit-integration.xml.dist --log-junit "$RUNNER_TEMP/junit-integration.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-integration-${{ matrix.row }}
          path: ${{ runner.temp }}/junit-integration.xml
          retention-days: 14

  integration-multisite:
    name: J-12 integration M-MS (PHP 8.5, WP 7.1.4, mariadb:12.3, multisite)
    # O-6: own job so PR runs do not start a database service for a skipped row;
    # runs nightly, manually and in the release lane only (R0-18 §1.3, KOMP-001/002).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      database:
        image: 'mariadb:12.3'
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ccap_test
          MARIADB_USER: ccap
          MARIADB_PASSWORD: ccap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DB_NAME: ccap_test
      WP_TESTS_DB_USER: ccap
      WP_TESTS_DB_PASSWORD: ccap
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: PHPUnit with the WordPress test suite (multisite)
        run: vendor/bin/phpunit --configuration phpunit-integration-multisite.xml.dist --log-junit "$RUNNER_TEMP/junit-integration.xml"
      - name: MS-002 network activation via WP-CLI
        run: bash tests/integration/cli/ms-002-network-activate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-integration-M-MS
          path: ${{ runner.temp }}/junit-integration.xml
          retention-days: 14

  old-runtime:
    name: J-17b old runtime (PHP 8.4, WP 6.9, mariadb:10.11) – RC-047
    # O-2: below the hard minimum the ZIP installs, refuses activation without writing
    # and shows an admin notice (R0-35 §5.6, R0-20 §1.2). Not a supported row.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: 'mariadb:10.11'
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ccap_old_runtime
          MARIADB_USER: ccap
          MARIADB_PASSWORD: ccap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DB_USER: ccap
      WP_TESTS_DB_PASSWORD: ccap
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mysqli, zip
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: Build the free ZIP from the commit
        run: tools/release/build-zips.sh --package=free --ref="$GITHUB_SHA" --out=dist
      - name: WordPress 6.9 and WP-CLI resolved for PHP 8.4 (no unpinned downloads)
        run: |
          mkdir -p "$RUNNER_TEMP/oldrt"
          cp tools/release/old-runtime/composer.json "$RUNNER_TEMP/oldrt/composer.json"
          composer --working-dir="$RUNNER_TEMP/oldrt" install --no-progress
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mysqli, zip
          coverage: none
          tools: none
      - name: Install, refused activation, admin notice on PHP 8.4 / WP 6.9
        env:
          WP_CLI: ${{ runner.temp }}/oldrt/vendor/bin/wp
        run: tools/release/old-runtime-test.sh dist/course-captain-*.zip "$RUNNER_TEMP/oldrt/vendor/roots/wordpress-no-content" ccap_old_runtime

  build-zip:
    name: J-17 build-zip (package, negative list, versions, artefact test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: 'mariadb:11.8'
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ccap_zip_test
          MARIADB_USER: ccap
          MARIADB_PASSWORD: ccap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DB_USER: ccap
      WP_TESTS_DB_PASSWORD: ccap
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mysqli, zip
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: Build the free ZIP from the commit (SOURCE_DATE_EPOCH = commit time)
        run: tools/release/build-zips.sh --package=free --ref="$GITHUB_SHA" --out=dist
      - name: Artefact checks (positive/negative list, versions, readme, php -l, free guard)
        run: php tools/release/check-zip.php dist/course-captain-*.zip
      - name: Clean install, deactivate/reactivate, uninstall without deletion
        run: tools/release/artifact-test.sh dist/course-captain-*.zip ccap_zip_test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: course-captain-zip
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
