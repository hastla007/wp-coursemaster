# CI for Course Captain Free (R0-18 §1; scope of R1-01: J-01, J-03, J-05, J-07, J-10, J-11, J-12).
# Further jobs (J-02, J-04, J-06, J-08, J-09, J-13 ... J-23) are added by the tasks that need them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly (R0-18 §1.2)
  workflow_dispatch:
  workflow_call:
    inputs:
      lane:
        description: 'pr | main | nightly | release'
        type: string
        default: release

# G-01: read-only by default.
permissions:
  contents: read

# G-05: cancel superseded PR runs only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# G-04: bash with pipefail.
defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint-php:
    name: J-01 lint-php (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: composer validate --strict
      - run: composer install --no-progress
      - name: php -l (shipped files)
        run: |
          find course-captain.php uninstall.php src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPCS (full WPCS, PHPCompatibilityWP 8.3-)
        run: vendor/bin/phpcs
      - name: Bootstrap file parses on old PHP (RC-047)
        run: vendor/bin/phpcs --standard=tools/qa/phpcs-bootstrap-compat.xml

  lint-i18n:
    name: J-03 lint-i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - run: composer install --no-progress
      - name: Text domain lint (literal course-captain, English source strings)
        run: php tests/guards/textdomain-lint.php
      - name: POT is up to date
        run: |
          vendor/bin/wp i18n make-pot . "$RUNNER_TEMP/course-captain.pot" --slug=course-captain --domain=course-captain \
            --exclude=vendor,tests,tools,docs,node_modules \
            --headers='{"Report-Msgid-Bugs-To":"https://wordpress.org/support/plugin/course-captain/"}'
          diff <(grep -v '^"POT-Creation-Date' languages/course-captain.pot) <(grep -v '^"POT-Creation-Date' "$RUNNER_TEMP/course-captain.pot")

  phpstan:
    name: J-05 phpstan (level 8, no baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - run: composer install --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  deps:
    name: J-07 deps
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - run: composer audit --locked

  free-guard:
    name: J-10 free-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Guard self-test (LIC-010)
        run: php tests/guards/free-guard.php --self-test
      - name: Guard on the source tree (LIC-001, RC-020)
        run: php tests/guards/free-guard.php

  unit:
    name: J-11 unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: composer install --no-progress
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist --log-junit "$RUNNER_TEMP/junit-unit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-unit-php${{ matrix.php }}
          path: ${{ runner.temp }}/junit-unit.xml
          retention-days: 14

  integration:
    name: J-12 integration ${{ matrix.row }} (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, ${{ matrix.db_image }}${{ matrix.multisite && ', multisite' || '' }})
    # Required rows M-Z, M-U, M-M on every run; M-MS (multisite) only nightly, manual and release (R0-18 §1.3).
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: M-Z
            php: '8.5'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mariadb:12.3'
            db_health: 'healthcheck.sh --connect --innodb_initialized'
            multisite: false
          - row: M-U
            php: '8.3'
            wp: '7.0.8'
            wp_phpunit: '7.0.7'
            db_image: 'mariadb:10.11'
            db_health: 'healthcheck.sh --connect --innodb_initialized'
            multisite: false
          - row: M-M
            php: '8.4'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mysql:8.4'
            db_health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot'
            multisite: false
          - row: M-MS
            php: '8.5'
            wp: '7.1.4'
            wp_phpunit: '7.1.3'
            db_image: 'mariadb:12.3'
            db_health: 'healthcheck.sh --connect --innodb_initialized'
            multisite: true
    services:
      database:
        image: ${{ matrix.db_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ccap_test
          MYSQL_USER: ccap
          MYSQL_PASSWORD: ccap
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ccap_test
          MARIADB_USER: ccap
          MARIADB_PASSWORD: ccap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db_health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DB_NAME: ccap_test
      WP_TESTS_DB_USER: ccap
      WP_TESTS_DB_PASSWORD: ccap
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: none
      - name: Skip M-MS outside nightly/manual/release lanes
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          MULTISITE: ${{ matrix.multisite }}
        run: |
          if [ "$MULTISITE" = "true" ] && [ "$EVENT" != "schedule" ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$EVENT" != "workflow_call" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: composer install --no-progress
        if: ${{ steps.lane.outputs.run == 'true' }}
      - name: Select WordPress ${{ matrix.wp }}
        if: ${{ steps.lane.outputs.run == 'true' && matrix.wp != '7.1.4' }}
        env:
          WP_VERSION: ${{ matrix.wp }}
          WP_PHPUNIT_VERSION: ${{ matrix.wp_phpunit }}
        run: composer require --dev --no-progress -W "roots/wordpress-no-content:${WP_VERSION}" "wp-phpunit/wp-phpunit:${WP_PHPUNIT_VERSION}"
      - name: PHPUnit with the WordPress test suite
        if: ${{ steps.lane.outputs.run == 'true' }}
        env:
          CONFIG: ${{ matrix.multisite && 'phpunit-integration-multisite.xml.dist' || 'phpunit-integration.xml.dist' }}
        run: vendor/bin/phpunit --configuration "$CONFIG" --log-junit "$RUNNER_TEMP/junit-integration.xml"
      - name: MS-002 network activation via WP-CLI
        if: ${{ steps.lane.outputs.run == 'true' && matrix.multisite }}
        run: bash tests/integration/cli/ms-002-network-activate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.lane.outputs.run == 'true' }}
        with:
          name: junit-integration-${{ matrix.row }}
          path: ${{ runner.temp }}/junit-integration.xml
          retention-days: 14
